
server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:commandesdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: change-moi-en-production-cle-longue-et-aleatoire
    expiration-ms: 3600000